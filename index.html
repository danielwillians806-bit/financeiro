<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro - Entradas e Saídas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .cards {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 25px;
        }

        .card {
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            color: #fff;
            text-align: center;
        }

        .card.income { background-color: #27ae60; }
        .card.expense { background-color: #c0392b; }
        .card.balance { background-color: #2980b9; }

        .card h3 {
            font-size: 0.9rem;
            margin-bottom: 5px;
            opacity: 0.9;
        }

        .card p {
            font-size: 1.2rem;
            font-weight: bold;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        input, select, button {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #2980b9;
        }

        button {
            background-color: #2c3e50;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #34495e;
        }

        h2 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        ul {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            background: #f8f9fa;
            border-left: 5px solid #ccc;
        }

        li.income { border-left-color: #27ae60; }
        li.expense { border-left-color: #c0392b; }

        .transaction-info {
            display: flex;
            flex-direction: column;
        }

        .transaction-info span.desc {
            font-weight: 500;
        }

        .transaction-info span.date {
            font-size: 0.75rem;
            color: #7f8c8d;
        }

        .transaction-amount {
            font-weight: bold;
        }

        li.income .transaction-amount { color: #27ae60; }
        li.expense .transaction-amount { color: #c0392b; }

        .delete-btn {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0 5px;
        }

        .delete-btn:hover {
            color: #c0392b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Controle Financeiro</h1>

        <div class="cards">
            <div class="card income">
                <h3>Entradas</h3>
                <p id="total-income">R$ 0,00</p>
            </div>
            <div class="card expense">
                <h3>Saídas</h3>
                <p id="total-expense">R$ 0,00</p>
            </div>
            <div class="card balance">
                <h3>Saldo</h3>
                <p id="total-balance">R$ 0,00</p>
            </div>
        </div>

        <form id="transaction-form">
            <input type="text" id="description" placeholder="Descrição (ex: Frete, Aluguel...)" required>
            <input type="number" id="amount" placeholder="Valor (R$)" step="0.01" required>
            <select id="type" required>
                <option value="" disabled selected>Selecione o Tipo</option>
                <option value="income">Entrada</option>
                <option value="expense">Saída</option>
            </select>
            <button type="submit">Adicionar Lançamento</button>
        </form>

        <h2>Histórico</h2>
        <ul id="transaction-list"></ul>
    </div>

    <script>
        const form = document.getElementById('transaction-form');
        const descriptionInput = document.getElementById('description');
        const amountInput = document.getElementById('amount');
        const typeInput = document.getElementById('type');
        
        const totalIncomeEl = document.getElementById('total-income');
        const totalExpenseEl = document.getElementById('total-expense');
        const totalBalanceEl = document.getElementById('total-balance');
        const transactionListEl = document.getElementById('transaction-list');

        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

        function saveAndRefresh() {
            localStorage.setItem('transactions', JSON.stringify(transactions));
            init();
        }

        function addTransaction(e) {
            e.preventDefault();

            const newTransaction = {
                id: generateID(),
                description: descriptionInput.value,
                amount: parseFloat(amountInput.value),
                type: typeInput.value,
                date: new Date().toLocaleDateString('pt-BR')
            };

            transactions.push(newTransaction);
            saveAndRefresh();

            descriptionInput.value = '';
            amountInput.value = '';
            typeInput.value = '';
        }

        function generateID() {
            return Math.floor(Math.random() * 100000000);
        }

        function deleteTransaction(id) {
            transactions = transactions.filter(transaction => transaction.id !== id);
            saveAndRefresh();
        }

        function init() {
            transactionListEl.innerHTML = '';

            let income = 0;
            let expense = 0;

            transactions.forEach(transaction => {
                const amountFormatted = Math.abs(transaction.amount).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                
                if (transaction.type === 'income') {
                    income += transaction.amount;
                } else {
                    expense += transaction.amount;
                }

                const li = document.createElement('li');
                li.classList.add(transaction.type);
                
                li.innerHTML = `
                    <div class="transaction-info">
                        <span class="desc">${transaction.description}</span>
                        <span class="date">${transaction.date}</span>
                    </div>
                    <span class="transaction-amount">${transaction.type === 'income' ? '+ ' : '- '}${amountFormatted}</span>
                    <button class="delete-btn" onclick="deleteTransaction(${transaction.id})">&times;</button>
                `;

                transactionListEl.appendChild(li);
            });

            const balance = income - expense;

            totalIncomeEl.innerText = income.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            totalExpenseEl.innerText = expense.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            totalBalanceEl.innerText = balance.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        form.addEventListener('submit', addTransaction);

        init();
    </script>
</body>
</html>
